[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelml"
version = "0.3.0"
description = "SentinelML - drift-aware network intrusion detection MLOps platform"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "lightgbm>=4.0",
    "mlflow>=2.16,<3.0",
    "plotly>=5.18",
    "shap>=0.45",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "tabulate>=0.9",
    "sqlalchemy>=2.0,<2.1",  # mlflow 2.x breaks on SQLAlchemy 2.1
    "pyarrow>=14",           # parquet outputs of the preprocess stage
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.27", "streamlit>=1.40"]
dvc = ["dvc[s3]>=3.50"]   # data/model versioning + S3 remote
dashboard = ["streamlit>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
